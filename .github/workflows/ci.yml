name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Swift 6.3.3 on ubuntu-latest
    runs-on: ubuntu-latest
    container:
      image: swift:6.3.3-noble
    timeout-minutes: 45

    steps:
      - name: Check out repository and LibRaw
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: apt-get update && apt-get install -y zlib1g-dev

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release configuration
        run: swift build -c release

  macos:
    name: Swift 6.3.3 on macos-26
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository and LibRaw
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show toolchain
        run: xcrun swift --version

      - name: Run tests
        run: xcrun swift test

      - name: Build release configuration
        run: xcrun swift build -c release
